<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crazy Airdrop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at top, #111 0%, #000 65%);
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  .center {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
  }

  .card {
    padding: 52px 62px;
    border-radius: 22px;
    background: linear-gradient(135deg, #1e1e1e, #0a0a0a);
    box-shadow: 0 0 50px rgba(0,255,200,0.35);
    position: relative;
    min-width: min(620px, 92vw);
  }

  h1 {
    margin: 0 0 10px 0;
    font-size: 2.8rem;
    letter-spacing: 1px;
  }

  .sub {
    opacity: 0.85;
    margin-bottom: 18px;
    font-size: 1.05rem;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    font-size: 0.95rem;
    opacity: 0.9;
    user-select: none;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
  }
  .dot.ok { background: #00ffc8; box-shadow: 0 0 12px rgba(0,255,200,0.7); }

  button {
    font-size: 1.08rem;
    padding: 14px 18px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    color: #000;
    background: linear-gradient(135deg, #00ffc8, #00d4ff);
    font-weight: 900;
    box-shadow: 0 0 22px rgba(0,255,200,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    min-width: 190px;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 38px rgba(0,255,200,0.9);
  }
  button:disabled {
    cursor: not-allowed;
    filter: grayscale(0.4) brightness(0.9);
    box-shadow: 0 0 12px rgba(0,255,200,0.25);
    transform: none;
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    padding: 14px 16px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    max-width: min(780px, 92vw);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-6px);
  }
  .badge {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: rgba(0,255,200,0.15);
    border: 1px solid rgba(0,255,200,0.35);
    flex: 0 0 auto;
  }
  .toast .title {
    font-weight: 900;
    margin: 0;
    line-height: 1.1;
  }
  .toast .meta {
    margin: 2px 0 0 0;
    opacity: 0.8;
    font-size: 0.92rem;
    word-break: break-all;
  }

  /* Stage */
  .stage {
    display: none;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    justify-content: center;
    padding: 18px;
    width: min(760px, 94vw);
  }

  .stageTitle {
    font-size: 1.45rem;
    font-weight: 950;
    opacity: 0.96;
    margin-bottom: 4px;
  }

  .memeImg {
    width: min(520px, 92vw);
    max-height: 70vh;
    border-radius: 18px;
    box-shadow: 0 0 34px rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.03);
    object-fit: contain;
  }

  .hint {
    opacity: 0.75;
    font-size: 0.95rem;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="center">
  <!-- Card -->
  <div id="card" class="card">
    <h1>AirDrop Glitch</h1>
    <div class="sub">connect wallet, then claim your “reward”</div>

    <div class="row" style="margin-bottom: 16px;">
      <span class="pill">
        <span id="dot" class="dot"></span>
        <span id="statusText">Wallet: not connected</span>
      </span>
    </div>

    <div class="row">
      <button id="connect">Connect Wallet</button>
      <button id="claimLink" disabled>Claim 2,000 LINK</button>
